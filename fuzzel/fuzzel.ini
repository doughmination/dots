# Cyberpunk palette, matches ~/.config/sway/cyberpunk
[main]
font=JetBrainsMono Nerd Font:size=12
terminal=kitty -e
prompt="❯ "
icon-theme=Adwaita
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=8
layer=overlay

[colors]
background=040A10D9
text=E8FBFDff
prompt=E455AEff
placeholder=52545Bff
input=5DF4FEff
match=1AC5B0ff
selection=E455AEff
selection-text=040A10ff
selection-match=040A10ff
border=E455AEff

[border]
width=2
radius=16
