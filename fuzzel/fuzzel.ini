# Clockwork palette, matches ~/.config/sway/clockwork
[main]
font=JetBrainsMono Nerd Font:size=12
terminal=kitty -e
prompt="❯ "
icon-theme=Adwaita
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=8
layer=overlay

[colors]
background=050A14D9
text=E9E4DFff
prompt=5FD4F0ff
placeholder=4A5A72ff
input=E9E4DFff
match=D4B072ff
selection=5FD4F0ff
selection-text=050A14ff
selection-match=5A0F1Cff
border=5FD4F0ff

[border]
width=2
radius=16
