[General]
# These files are copied in next to Main.qml by install-assets.sh
# (the login screen can't read your home folder).
background=background.png
video=background.webm
# Play the animated wallpaper behind the login box (false = still only)
useVideo=true
avatar=avatar.png
# Darken the wallpaper a little so the box stands out (0 = none, 1 = black)
dim=0.25
